<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<title>Hábitos saludables</title>
<style>
:root{
  --bg:#f6f2ea; --card:#fffdf9; --ink:#2e3328; --ink2:#666b5b; --muted:#a3a393; --line:#e8e2d4;
  --sage:#a9b89b; --sage-soft:#e7ecdc; --olive:#6b7a50; --olive-d:#4b5838;
  --terra:#c0714d; --terra-soft:#f8e7dd; --terra-d:#9a5233;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:light;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;font-family:var(--font);font-weight:400;line-height:1.4;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(110% 55% at 100% 0%,#e8eddd 0%,transparent 60%),
    radial-gradient(90% 45% at 0% 100%,#f4e8dc 0%,transparent 60%),
    var(--bg);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 44px)}
.ico{width:20px;height:20px;flex:none}

/* Encabezado */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}
h1{margin:0;font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1.12;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h2{margin:0;font-weight:300}
.sub{margin:8px 0 0;font-size:14.5px;color:var(--ink2)}
.long{margin:7px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,253,249,.75);color:var(--ink2);flex:none;transition:background .2s}
.iconbtn:active{background:var(--sage-soft)}

/* Tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 20px;margin-top:16px;
  box-shadow:0 1px 2px rgba(80,70,40,.04),0 16px 34px -22px rgba(80,70,40,.22)}
.card:first-of-type{margin-top:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.big{font-size:27px;font-weight:300;letter-spacing:-.015em;margin-top:6px;line-height:1.15}
.stathead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;margin:-4px 0;padding:5px 11px 5px 8px;border-radius:999px;
  background:var(--terra-soft);color:var(--terra-d);font-size:12.5px;font-weight:500}
.chip .ico{width:14px;height:14px;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.8}}

/* Escalera */
.ladder{position:relative;height:192px;margin:-34px 0 4px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.stp{height:calc(30px + var(--n) * 16px);border-radius:11px 11px 4px 4px;padding-top:8px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:rgba(232,226,212,.5);color:#8f907e;font-size:12.5px;font-weight:500;
  transition:background .7s ease,color .7s ease}
.stp .ico{width:13px;height:13px}
.stp.done{background:linear-gradient(180deg,#d3dcc8,#bfcab1);color:var(--olive-d)}
.stp.cur{background:linear-gradient(180deg,#7f8e62,#66744c);color:#fff;box-shadow:0 10px 18px -10px rgba(75,88,56,.6)}
.stp.cur.fire{background:linear-gradient(180deg,#cf8765,#b76843);box-shadow:0 10px 18px -10px rgba(154,82,51,.6)}
.stp.next{background:rgba(231,236,220,.6);box-shadow:inset 0 0 0 1.5px var(--sage);color:var(--olive);animation:nextp 2.6s ease-in-out infinite}
@keyframes nextp{0%,100%{box-shadow:inset 0 0 0 1.5px var(--sage)}50%{box-shadow:inset 0 0 0 1.5px var(--olive)}}
.marker{position:absolute;z-index:2;pointer-events:none;
  bottom:calc(30px + var(--cur) * 16px);
  left:calc((100% - 36px) / 7 * (var(--cur) + .5) + 6px * var(--cur));
  transform:translateX(-50%);
  transition:left .95s cubic-bezier(.45,.05,.2,1),bottom .95s cubic-bezier(.45,.05,.2,1)}
.marker.nomove{transition:none}
.hop{display:flex;flex-direction:column;align-items:center;gap:4px}
.marker.moving .hop{animation:hop .95s ease}
@keyframes hop{0%{transform:translateY(0)}38%{transform:translateY(-24px)}100%{transform:translateY(0)}}
.pill{font-size:10.5px;font-weight:500;color:var(--olive-d);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap;letter-spacing:.01em;box-shadow:0 4px 10px -6px rgba(60,60,30,.3)}
.marker.fire .pill{color:var(--terra-d)}
.fig{width:22px;height:34px;fill:currentColor;color:var(--olive-d);display:block}
.marker.fire .fig{color:var(--terra-d)}
.marker.nofig .fig{display:none}

/* Mensaje bajo la escalera */
.hint{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--sage-soft);color:var(--olive-d)}
.hint .ico{width:20px;height:20px;margin-top:1px}
.hint .ht{font-size:15px;font-weight:500;line-height:1.3}
.hint .hs{font-size:13.5px;color:var(--ink2);margin-top:2px}
.hint.plain{background:none;padding:6px 2px 0;margin-top:12px}
.hint.plain .ht{color:var(--ink);font-weight:500}
.hint.fire{background:var(--terra-soft);color:var(--terra-d)}
.hint.fire .ico{animation:flick 2.6s ease-in-out infinite}

/* Aviso */
.notice{background:var(--sage-soft);border-radius:22px;padding:18px 18px 14px;margin-bottom:16px;color:var(--olive-d)}
.notice .nt{font-size:15px;font-weight:500}
.notice .ns{font-size:13.5px;color:var(--ink2);margin-top:4px}
.notice button{margin-top:10px;font-size:13.5px;font-weight:500;color:var(--olive-d);padding:6px 0}

/* Misión */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-size:22px;font-weight:300;letter-spacing:-.01em;margin-top:6px}
.pring{width:46px;height:46px;flex:none}
.pring circle{fill:none;stroke-width:2.5}
.pring .bg{stroke:var(--line)}
.pring .fg{stroke:var(--olive);stroke-linecap:round;stroke-dasharray:113.1;transition:stroke-dashoffset .6s ease}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 11px 5px 8px;border-radius:999px;background:var(--sage-soft);color:var(--olive-d);font-size:12.5px;font-weight:500}
.tag .ico{width:14px;height:14px}
.list{list-style:none;margin:14px 0 0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.habit{display:flex;align-items:center;gap:14px;width:100%;padding:15px 2px;text-align:left}
.box{width:27px;height:27px;border-radius:50%;border:1.5px solid #cdc6b3;display:grid;place-items:center;color:transparent;flex:none;transition:background .25s,border-color .25s,color .25s}
.box .ico{width:15px;height:15px;stroke-width:2.2}
.habit .nm{flex:1;font-size:16.5px;transition:color .25s}
.habit .hi{color:#bdbcab;width:20px;height:20px}
.habit .opt{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-right:2px}
.habit[aria-checked=true] .box{background:var(--olive);border-color:var(--olive);color:#fff}
.habit[aria-checked=true] .nm{color:var(--ink2)}
.habit[aria-checked=true] .hi{color:var(--sage)}
.box.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
.editbtn{display:flex;align-items:center;gap:7px;margin:8px auto -4px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.editbtn .ico{width:15px;height:15px}

/* Camino de niveles */
.levels{display:flex;margin-top:18px}
.lv{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.lv + .lv::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:1px;background:var(--line)}
.lv.done + .lv::before{background:var(--sage)}
.dot{position:relative;z-index:1;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:500}
.dot .ico{width:14px;height:14px;stroke-width:2.2}
.lv.done .dot{background:var(--olive);border-color:var(--olive);color:#fff}
.lv.cur .dot{background:var(--sage-soft);border:1.5px solid var(--olive);color:var(--olive-d)}
.lv .lbl{font-size:11.5px;color:var(--muted)}
.lv.cur .lbl{color:var(--olive-d);font-weight:500}
.lv.done .lbl{color:var(--ink2)}
.lvdesc{margin:18px 0 0;font-size:13.5px;color:var(--ink2);text-align:center}
.foot{margin:26px 0 0;text-align:center;font-size:12px;color:var(--muted)}

/* Historial */
.hh{align-items:center;margin-bottom:22px}
.hh h2{font-size:24px;letter-spacing:-.01em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px}
.wd .dn{font-size:11.5px;color:var(--muted)}
.wd.today .dn{color:var(--olive-d);font-weight:500}
.wd .c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.wd .c .ico{width:18px;height:18px}
.wd .dd{font-size:11px;color:var(--muted)}
.c.ok{background:var(--olive);border-color:var(--olive);color:#fff}
.c.defend{background:var(--sage-soft);border-color:var(--sage);color:var(--olive-d)}
.c.fire{background:var(--terra-soft);border-color:#ecc7b4;color:var(--terra-d)}
.c.reset{background:#f0ebdf;color:var(--ink2)}
.c.pending{border-style:dashed;border-color:var(--sage)}
.c.none::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--line)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.legend div{display:flex;align-items:center;gap:9px}
.legend .ico{width:16px;height:16px;color:var(--olive)}
.legend .f .ico{color:var(--terra)}
.saved{list-style:none;margin:14px 0 0;padding:0}
.saved li{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:15px;border-top:1px solid var(--line)}
.saved li:first-child{border-top:0}
.saved .ico{color:var(--olive)}

/* Recompensa */
.reward{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;
  background:rgba(246,242,234,.74);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;transition:opacity .4s ease}
.reward.show{opacity:1}
.rcard{width:min(330px,100%);text-align:center;padding:36px 24px 30px;background:var(--card);border:1px solid var(--line);border-radius:30px;
  box-shadow:0 34px 60px -34px rgba(70,80,40,.4);transform:translateY(16px) scale(.98);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.reward.show .rcard{transform:none}
.rbadge{position:relative;width:88px;height:88px;margin:0 auto 20px;border-radius:50%;background:var(--sage-soft);color:var(--olive)}
.rbadge.fire{background:var(--terra-soft);color:var(--terra)}
.rbadge::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;opacity:0}
.show .rbadge::after{animation:ripple 1.6s .9s ease-out}
@keyframes ripple{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.7);opacity:0}}
.rbadge svg{position:absolute;inset:0;width:100%;height:100%}
.rbadge .ring{fill:none;stroke:currentColor;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1}
.rbadge .draw{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.show .rbadge .ring{animation:draw .9s .15s ease forwards}
.show .rbadge .draw{animation:draw .7s .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;transform:translateY(8px)}
.show .fade{animation:up .7s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
.rt{font-size:25px;font-weight:300;letter-spacing:-.015em;line-height:1.2}
.rs{margin-top:12px;font-size:15px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:9px}
.rs .ico{width:16px;height:16px;color:var(--sage)}
.rs b{font-weight:500;color:var(--olive-d)}
.rm{margin-top:16px;font-size:14px;color:var(--olive-d)}
.rtap{margin-top:22px;font-size:11.5px;color:var(--muted)}

/* Hoja inferior */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(46,51,40,.28);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.sheet.show{opacity:1}
.sheetbody{width:100%;max-width:440px;max-height:88dvh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;
  padding:12px 22px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(40px);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet.show .sheetbody{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.sheetbody h3{margin:0;font-size:22px;font-weight:300;letter-spacing:-.01em}
.sheetbody .help{margin:6px 0 0;font-size:13.5px;color:var(--ink2)}
.elist{list-style:none;margin:18px 0 0;padding:0}
.elist li{padding:14px 0;border-top:1px solid var(--line)}
.elist li:first-child{border-top:0}
.elist .nmi{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.elist .nmi:focus{border-color:var(--sage)}
.erow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.sw{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{position:relative;width:38px;height:22px;border-radius:999px;background:#ddd7c8;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked + i{background:var(--olive)}
.sw input:checked + i::after{transform:translateX(16px)}
.sw input:focus-visible + i{outline:2px solid var(--sage);outline-offset:2px}
.del{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.del:active{background:var(--terra-soft);color:var(--terra-d)}
.addbtn{display:flex;align-items:center;gap:8px;margin:6px 0 0;padding:12px 4px;font-size:14.5px;color:var(--olive-d);font-weight:500}
.addbtn .ico{width:17px;height:17px}
.warn{min-height:20px;margin:6px 0 0;font-size:13px;color:var(--terra-d)}
.primary{display:block;width:100%;margin-top:10px;padding:15px;border-radius:18px;background:var(--olive);color:#fff;font-size:16px;font-weight:500;text-align:center}
.primary:active{background:var(--olive-d)}
.ghost{display:block;width:100%;margin-top:10px;padding:14px;border-radius:18px;border:1px solid var(--line);color:var(--ink2);font-size:15px;text-align:center}
.ghost.danger{color:var(--terra-d)}
.trow{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,20px);z-index:60;
  background:var(--ink);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .fade{opacity:1;transform:none}
  .rbadge .ring,.rbadge .draw{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ PANTALLA PRINCIPAL ============ -->
  <main id="viewMain">
    <header class="top">
      <div>
        <h1 id="title">Hábitos saludables</h1>
        <p class="sub">Construyendo la vida que quiero mantener.</p>
        <p class="long">Meta a largo plazo: bajar de peso.</p>
      </div>
      <button class="iconbtn" id="btnHist" aria-label="Ver últimos días"></button>
    </header>

    <div id="notice"></div>

    <section class="card">
      <div class="stathead"><div class="eyebrow" id="eyebrow"></div><div id="chip"></div></div>
      <div class="big" id="big"></div>
      <div class="ladder" id="ladder" aria-label="Escalera de 7 escalones"></div>
      <div id="hint"></div>
    </section>

    <section class="card">
      <div class="mhead">
        <div>
          <div class="eyebrow">Misión de hoy</div>
          <div class="count" id="mcount"></div>
        </div>
        <svg class="pring" viewBox="0 0 44 44" aria-hidden="true">
          <circle class="bg" cx="22" cy="22" r="18"/>
          <circle class="fg" id="ringfg" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" stroke-dashoffset="113.1"/>
        </svg>
      </div>
      <div id="mtag"></div>
      <ul class="list" id="list"></ul>
      <button class="editbtn" id="btnEdit"></button>
    </section>

    <section class="card">
      <div class="eyebrow">Tu camino</div>
      <div class="levels" id="levels"></div>
      <p class="lvdesc" id="lvdesc"></p>
    </section>

    <p class="foot">Un día imperfecto no borra lo que ya construiste.</p>
  </main>

  <!-- ============ HISTORIAL ============ -->
  <section id="viewHist" hidden>
    <header class="top hh">
      <button class="iconbtn" id="btnBack" aria-label="Volver"></button>
      <h2>Últimos días</h2>
      <span style="width:42px"></span>
    </header>
    <div class="card">
      <div class="week" id="week"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card" id="saved" hidden>
      <div class="eyebrow">Niveles guardados</div>
      <ul class="saved" id="savedList"></ul>
    </div>
    <p class="foot">Lo importante es seguir avanzando.</p>
  </section>

</div>

<div class="reward" id="reward" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheetbody" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
'use strict';

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,Number(n)||a));
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d)};
const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

/* ---------- Iconos lineales ---------- */
const IC={
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  flag:'<path d="M6 21V4M6 5h11l-2.2 3.5L17 12H6"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/>',
  shield:'<path d="M12 3l7 3v5.5c0 4.4-3 7.6-7 9.5-4-1.9-7-5.1-7-9.5V6l7-3zM9 12l2 2 4-4"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M5 7h14M10 7V4.5h4V7M7 7l.8 13h8.4L17 7M10.5 11v6M13.5 11v6"/>',
  back:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
  cal:'<rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
  redo:'<path d="M4 12a8 8 0 1 0 2.6-5.9M4 4.5V9h4.5"/>',
  up:'<path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/>',
  arrow:'<path d="M5 12h14M13.5 6.5L19 12l-5.5 5.5"/>',
  drop:'<path d="M12 3.5c3.2 3.9 5.5 6.6 5.5 9.6a5.5 5.5 0 0 1-11 0c0-3 2.3-5.7 5.5-9.6z"/>',
  sunrise:'<path d="M3 18.5h18M7 18.5a5 5 0 0 1 10 0M12 6.5v3M5.2 10.7l1.8 1.8M18.8 10.7L17 12.5"/>',
  utensils:'<path d="M6.5 3v6a2.5 2.5 0 0 0 5 0V3M9 3v18M17 21V3c-2 1.4-3 3.6-3 6.5V13h3"/>',
  cup:'<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3v2M12 3v2"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  pulse:'<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>',
  list:'<rect x="6" y="4.5" width="12" height="16" rx="2"/><path d="M9.5 4.5V3.5h5v1M9 10h6M9 14h4"/>',
  leaf:'<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14M5 19c3-4 6-6 9-8"/>'
};
const ico=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||IC.leaf}</svg>`;
const FIG='<svg class="fig" viewBox="0 0 28 44" aria-hidden="true"><circle cx="14" cy="6" r="4.6"/><path d="M14 13c-3 0-4.6 1.8-5 4.6L7.6 29h12.8L19 17.6c-.4-2.8-2-4.6-5-4.6z"/><path d="M11.3 29v13M16.7 29v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

/* ---------- Datos del juego ---------- */
const KEY='habitos-saludables-v1';
const LEVELS=[
  {name:'Construir',  desc:'Crear las bases.'},
  {name:'Consolidar', desc:'Mantenerlas.'},
  {name:'Fortalecer', desc:'Convertirlas en algo cada vez más natural.'},
  {name:'Vivirlo',    desc:'“Así es como vivo.”'}
];
const DEFAULT_HABITS=[
  {id:'agua',       name:'Agua 2 L',           req:true, icon:'drop'},
  {id:'desayuno',   name:'Desayuno',           req:true, icon:'sunrise'},
  {id:'almuerzo',   name:'Almuerzo',           req:true, icon:'utensils'},
  {id:'merienda',   name:'Merienda',           req:true, icon:'cup'},
  {id:'cena',       name:'Cena',               req:true, icon:'moon'},
  {id:'movimiento', name:'Movimiento',         req:true, icon:'pulse'},
  {id:'preparar',   name:'Preparar alimentos', req:true, icon:'list'}
];

function fresh(){
  return {
    v:1, level:1, step:1, fire:false, completed:[], finished:false,
    habits:DEFAULT_HABITS.map(h=>({...h})),
    day:keyOf(new Date()), checks:{}, history:{},
    snap:null, notice:null, offset:0, fig:true
  };
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const s=JSON.parse(raw);
      if(s && s.v===1){
        const o=Object.assign(fresh(),s);
        o.level=clamp(o.level,1,4); o.step=clamp(o.step,1,7);
        if(!Array.isArray(o.completed)) o.completed=[];
        if(!Array.isArray(o.habits)||!o.habits.length) o.habits=DEFAULT_HABITS.map(h=>({...h}));
        if(!o.habits.some(h=>h.req)) o.habits[0].req=true;
        if(!/^\d{4}-\d\d-\d\d$/.test(o.day)) o.day=keyOf(new Date());
        if(!o.checks||typeof o.checks!=='object') o.checks={};
        if(!o.history||typeof o.history!=='object') o.history={};
        return o;
      }
    }
  }catch(e){}
  return fresh();
}
let state=load();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

/* ---------- Lógica del día ---------- */
function todayKey(){ const d=new Date(); d.setDate(d.getDate()+(state.offset||0)); return keyOf(d); }
const DONE=['ok','defend','level'];
const isDone=k=>DONE.includes(state.history[k]);
const doneToday=()=>isDone(state.day);
const required=()=>state.habits.filter(h=>h.req);
const allRequiredDone=()=>{const r=required();return r.length>0&&r.every(h=>state.checks[h.id])};

/* Evalúa los días que pasaron antes de empezar el nuevo.
   - Misión completa: ya se aplicó cuando se completó (subió o defendió).
   - Incompleta sin fuego: se activa el día de fuego.
   - Incompleta con fuego activo: se reinicia el nivel actual (nunca los anteriores). */
function rollover(){
  const t=todayKey();
  if(state.day>=t) return;
  let d=state.day, guard=0;
  while(d<t && guard++<400){
    if(!isDone(d)){
      if(state.finished){
        state.history[d]='miss';
      }else if(state.fire){
        if(state.step>1) state.notice='reset';
        state.step=1; state.fire=false; state.history[d]='reset';
      }else{
        state.fire=true; state.history[d]='fire';
      }
    }
    d=addDays(d,1);
  }
  state.day=t; state.checks={}; state.snap=null;
  const keys=Object.keys(state.history).sort();
  while(keys.length>200) delete state.history[keys.shift()];
}

/* Se completó la misión de hoy. */
function complete(){
  state.snap={level:state.level,step:state.step,fire:state.fire,completed:[...state.completed],finished:state.finished,notice:state.notice};
  state.notice=null;
  let ev;
  if(state.finished){
    state.history[state.day]='ok';
    ev={kind:'again'};
  }else if(state.fire){
    state.fire=false; state.history[state.day]='defend';
    ev={kind:'defend',step:state.step};
  }else if(state.step<7){
    const from=state.step; state.step++; state.history[state.day]='ok';
    ev={kind:'advance',from,to:state.step};
  }else{
    const done=state.level;
    state.completed.push(done); state.history[state.day]='level';
    if(done<4){ state.level++; state.step=1; ev={kind:'level',done,next:state.level}; }
    else{ state.finished=true; ev={kind:'final'}; }
  }
  save(); render({ladder:false}); showReward(ev);
}
/* Si se desmarca un hábito obligatorio después de completar, se deshace. */
function undoCompletion(){
  const s=state.snap;
  if(s){ state.level=s.level; state.step=s.step; state.fire=s.fire; state.completed=s.completed; state.finished=s.finished; state.notice=s.notice; }
  delete state.history[state.day]; state.snap=null;
}
function toggle(id){
  const h=state.habits.find(x=>x.id===id); if(!h) return;
  const wasDone=doneToday();
  if(state.checks[id]){
    delete state.checks[id];
    if(wasDone && h.req) undoCompletion();
    save(); render({anim:true}); pop(id);
  }else{
    state.checks[id]=true;
    if(!wasDone && allRequiredDone()){ syncList(); pop(id); complete(); return; }
    save(); render({anim:true}); pop(id);
  }
}
function maybeComplete(){ if(!doneToday() && allRequiredDone()) complete(); }

/* ---------- Dibujo ---------- */
function render(o={}){
  renderStatus(); renderHint(); renderNotice(); syncList(); renderPath(); renderHist();
  if(o.ladder!==false) renderLadder(o.anim);
}
function renderStatus(){
  $('#eyebrow').textContent=`Nivel ${state.level} · ${LEVELS[state.level-1].name}`;
  $('#big').textContent=`Escalón ${state.step} de 7`;
  $('#chip').innerHTML = (state.fire && !doneToday()) ? `<span class="chip">${ico('flame')}Día de fuego</span>` : '';
}
function renderHint(){
  const r=state.history[state.day];
  let cls='plain', icon='up', t='', s='';
  if(doneToday()){
    cls='ok'; icon='check';
    if(r==='defend'){ t='Posición defendida'; s=`Mañana seguís hacia el escalón ${state.step+1}.`; icon='shield'; }
    else if(r==='level'){
      icon='trophy';
      if(state.finished){ t='Camino completado'; s='Los cuatro niveles son tuyos.'; }
      else{ t=`Nivel ${state.level-1} completado`; s=`Mañana empezás el nivel ${state.level}: ${LEVELS[state.level-1].name}.`; }
    }
    else if(state.finished){ t='Misión completada'; s='Cada día suma.'; }
    else{ t='Hoy ya subiste'; s=state.step<7?`Mañana, el escalón ${state.step+1}.`:'Mañana podés completar el nivel.'; }
  }else if(state.fire){
    cls='fire'; icon='flame'; t='Día de fuego disponible';
    s=state.step>1?'Tu posición está en juego. Hoy podés defender tu escalón. Si no completás la misión, volvés al escalón 1 de este nivel.':'Tu posición está en juego. Completá la misión para dejar atrás el día de fuego.';
  }else if(state.finished){ icon='check'; t='Camino completado'; s='Cada día sigue sumando.'; }
  else if(state.step<7){ t=`Próximo escalón: ${state.step+1}`; s='Completá la misión de hoy para subir.'; }
  else{ icon='flag'; t='Último escalón'; s='Completá la misión de hoy y terminás el nivel.'; }
  $('#hint').innerHTML=`<div class="hint ${cls}">${ico(icon)}<div><div class="ht">${t}</div><div class="hs">${s}</div></div></div>`;
}
function renderNotice(){
  const el=$('#notice');
  if(state.notice==='reset'){
    el.innerHTML=`<div class="notice"><div class="nt">Volvés a empezar este nivel</div>
      <div class="ns">Un día imperfecto no borra lo que ya construiste.${state.completed.length?' Tus niveles anteriores siguen guardados.':''}</div>
      <button id="btnNotice">Entendido</button></div>`;
  }else el.innerHTML='';
}

/* Escalera */
function renderLadder(anim){
  const el=$('#ladder');
  if(!el.dataset.built){
    el.innerHTML=[...Array(7)].map((_,i)=>
      `<div class="stp" style="--n:${i}"><span>${i+1}</span>${i===6?ico('flag'):''}</div>`).join('')+
      `<div class="marker" id="marker" style="--cur:0"><div class="hop"><span class="pill" id="pill"></span>${FIG}</div></div>`;
    el.dataset.built='1'; el.dataset.cur='0';
  }
  const cur=state.step-1, prev=Number(el.dataset.cur);
  el.querySelectorAll('.stp').forEach((s,i)=>{
    s.classList.toggle('done',i<cur);
    s.classList.toggle('cur',i===cur);
    s.classList.toggle('fire',i===cur && state.fire && !doneToday());
    s.classList.toggle('next',i===cur+1 && !state.finished);
  });
  const m=$('#marker'), fire=state.fire && !doneToday();
  m.classList.toggle('fire',fire);
  m.classList.toggle('nofig',!state.fig);
  $('#pill').textContent=fire?'En juego':'Estás acá';
  if(cur!==prev){
    if(anim==='jump'){
      m.classList.add('nomove'); m.style.setProperty('--cur',cur);
      void m.offsetWidth; m.classList.remove('nomove');
    }else if(anim){
      m.classList.add('moving'); m.style.setProperty('--cur',cur);
      setTimeout(()=>m.classList.remove('moving'),1000);
    }else{
      m.classList.add('nomove'); m.style.setProperty('--cur',cur);
      void m.offsetWidth; m.classList.remove('nomove');
    }
    el.dataset.cur=String(cur);
  }
}

/* Misión */
function buildList(){
  $('#list').innerHTML=state.habits.map(h=>
    `<li><button class="habit" role="checkbox" aria-checked="false" data-id="${esc(h.id)}">
      <span class="box">${ico('check')}</span>
      <span class="nm">${esc(h.name)}</span>
      ${h.req?'':'<span class="opt">opcional</span>'}
      ${ico(h.icon,'hi')}
    </button></li>`).join('');
}
function syncList(){
  document.querySelectorAll('#list .habit').forEach(b=>b.setAttribute('aria-checked',state.checks[b.dataset.id]?'true':'false'));
  const req=required(), n=req.filter(h=>state.checks[h.id]).length, t=req.length;
  $('#mcount').textContent=`${n} de ${t} completados`;
  $('#ringfg').setAttribute('stroke-dashoffset',(113.1*(1-(t?n/t:0))).toFixed(1));
  $('#mtag').innerHTML=doneToday()?`<span class="tag">${ico('check')}${state.history[state.day]==='defend'?'Posición defendida':'Misión completada'}</span>`:'';
}
function pop(id){
  const b=document.querySelector(`#list .habit[data-id="${CSS.escape(id)}"] .box`);
  if(b){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
}

/* Niveles */
function renderPath(){
  $('#levels').innerHTML=LEVELS.map((L,i)=>{
    const n=i+1, done=state.completed.includes(n), cur=!done && n===state.level;
    return `<div class="lv ${done?'done':cur?'cur':''}"><span class="dot">${done?ico('check'):n}</span><span class="lbl">${L.name}</span></div>`;
  }).join('');
  $('#lvdesc').textContent=state.finished?'Los cuatro niveles están completos.':`Nivel ${state.level} · ${LEVELS[state.level-1].desc}`;
}

/* Historial */
function renderHist(){
  const t=state.day;
  let html='';
  for(let i=6;i>=0;i--){
    const k=addDays(t,-i), r=state.history[k];
    let cls='none', icon='';
    if(r==='ok'){cls='ok';icon='check'}
    else if(r==='level'){cls='ok';icon='trophy'}
    else if(r==='defend'){cls='defend';icon='shield'}
    else if(r==='fire'){cls='fire';icon='flame'}
    else if(r==='reset'){cls='reset';icon='redo'}
    else if(i===0){cls='pending'}
    const d=parse(k);
    html+=`<div class="wd ${i===0?'today':''}"><span class="dn">${DAYS[d.getDay()]}</span><span class="c ${cls}">${icon?ico(icon):''}</span><span class="dd">${d.getDate()}</span></div>`;
  }
  $('#week').innerHTML=html;
  $('#legend').innerHTML=
    `<div>${ico('check')}Misión completa</div><div class="f">${ico('flame')}Día de fuego</div>`+
    `<div>${ico('shield')}Posición defendida</div><div>${ico('redo')}Nivel reiniciado</div>`;
  const saved=$('#saved');
  saved.hidden=!state.completed.length;
  $('#savedList').innerHTML=state.completed.map(n=>`<li>${ico('trophy')}Nivel ${n} · ${LEVELS[n-1].name}</li>`).join('');
}

/* ---------- Recompensa ---------- */
let rewardTimer=null, rewardMode=false;
function showReward(ev){
  let title='Misión completada', line='', msg='', badge='check';
  rewardMode=true;
  if(ev.kind==='advance'){
    line=`<span>Escalón ${ev.from}</span>${ico('arrow')}<b>Escalón ${ev.to}</b>`;
    msg=ev.to%2?'Un paso más.':'Hoy construiste otro día.';
  }else if(ev.kind==='defend'){
    title='Posición defendida'; badge='shield';
    line=`<span>Seguís en el escalón ${ev.step}</span>`;
    msg='Defendiste lo que ya construiste.';
  }else if(ev.kind==='level'){
    title='Nivel completado'; badge='trophy'; rewardMode='jump';
    line=`<span>Nivel ${ev.done} · ${LEVELS[ev.done-1].name}</span>${ico('check')}`;
    msg=`Se desbloqueó el nivel ${ev.next}: ${LEVELS[ev.next-1].name}.`;
  }else if(ev.kind==='final'){
    title='Nivel completado'; badge='trophy';
    line=`<span>Nivel 4 · ${LEVELS[3].name}</span>${ico('check')}`;
    msg='Completaste los cuatro niveles. Así es como vivís.';
  }else{
    line='<span>Cada día suma.</span>'; msg='Hoy construiste otro día.';
  }
  const d = badge==='check' ? null : IC[badge].match(/ d="([^"]+)"/)[1];
  const mark = d
    ? `<g transform="translate(26 26) scale(1.5)"><path class="draw" pathLength="1" d="${d}"/></g>`
    : '<path class="draw" pathLength="1" d="M30 45l10 10 19-21"/>';
  const r=$('#reward');
  r.innerHTML=`<div class="rcard"><div class="rbadge">
      <svg viewBox="0 0 88 88" aria-hidden="true"><circle class="ring" pathLength="1" cx="44" cy="44" r="40"/>${mark}</svg></div>
    <div class="rt fade" style="animation-delay:.5s">${title}</div>
    <div class="rs fade" style="animation-delay:.8s">${line}</div>
    <div class="rm fade" style="animation-delay:1.1s">${msg}</div>
    <div class="rtap fade" style="animation-delay:1.8s">Tocá para seguir</div></div>`;
  r.hidden=false; void r.offsetWidth; r.classList.add('show');
  clearTimeout(rewardTimer); rewardTimer=setTimeout(closeReward,4200);
}
function closeReward(){
  const r=$('#reward');
  if(r.hidden) return;
  clearTimeout(rewardTimer);
  r.classList.remove('show');
  const mode=rewardMode;
  setTimeout(()=>{
    r.hidden=true; r.innerHTML='';
    renderLadder(mode==='jump'?'jump':true);
    $('#ladder').scrollIntoView({behavior:'smooth',block:'nearest'});
  },380);
}

/* ---------- Hoja inferior (editar / prueba) ---------- */
const sheet=$('#sheet'), sheetBody=$('#sheetBody');
let sheetClose=null;
function openSheet(html,onClose){
  sheetBody.innerHTML=html; sheetClose=onClose||null;
  sheet.hidden=false; void sheet.offsetWidth; sheet.classList.add('show');
}
function closeSheet(){
  if(sheet.hidden) return;
  sheet.classList.remove('show');
  setTimeout(()=>{ if(!sheet.classList.contains('show')){ sheet.hidden=true; sheetBody.innerHTML=''; } },320);
  const f=sheetClose; sheetClose=null; if(f) f();
}
sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); closeReward(); } });

/* Editar hábitos */
function editRows(){
  return state.habits.map(h=>
    `<li data-id="${esc(h.id)}">
      <input class="nmi" type="text" maxlength="40" value="${esc(h.name)}" placeholder="Nuevo hábito" aria-label="Nombre del hábito">
      <div class="erow">
        <label class="sw"><input type="checkbox" ${h.req?'checked':''}><i></i><span>Obligatorio</span></label>
        <button class="del" data-act="del" aria-label="Quitar hábito">${ico('trash')}</button>
      </div></li>`).join('');
}
function openEdit(){
  openSheet(`<div class="grab"></div><h3>Editar hábitos</h3>
    <p class="help">Los obligatorios son los que cuentan para completar la misión de hoy.</p>
    <ul class="elist" id="elist">${editRows()}</ul>
    <button class="addbtn" data-act="add">${ico('plus')}Agregar hábito</button>
    <p class="warn" id="warn"></p>
    <button class="primary" data-act="close">Listo</button>`,
  ()=>{
    state.habits.forEach(h=>{ h.name=h.name.trim()||'Hábito'; });
    save(); buildList(); render({anim:true}); maybeComplete();
  });
}
function warn(t){ const w=$('#warn'); if(w){ w.textContent=t; setTimeout(()=>{ if(w.textContent===t) w.textContent=''; },2600); } }
sheetBody.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='close') closeSheet();
  else if(act==='add'){
    state.habits.push({id:'h'+Date.now().toString(36),name:'',req:true,icon:'leaf'});
    $('#elist').innerHTML=editRows();
    const ins=document.querySelectorAll('#elist .nmi'); ins[ins.length-1].focus();
    $('#elist').lastElementChild.scrollIntoView({block:'nearest'});
  }else if(act==='del'){
    const id=b.closest('li').dataset.id, h=state.habits.find(x=>x.id===id);
    if(h.req && required().length===1){ warn('Tiene que haber al menos un hábito obligatorio.'); return; }
    state.habits=state.habits.filter(x=>x.id!==id); delete state.checks[id];
    $('#elist').innerHTML=editRows();
  }else if(act==='nextday') simulateNextDay();
  else if(act==='fill'){
    closeSheet();
    setTimeout(()=>{ required().forEach(h=>{ if(!state.checks[h.id]) state.checks[h.id]=true; }); save(); render({ladder:false}); if(!doneToday()) complete(); },350);
  }
  else if(act==='reset'){
    if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Tocá otra vez para borrar todo'; return; }
    {
      localStorage.removeItem(KEY); state=fresh();
      closeSheet(); buildList(); const l=$('#ladder'); l.innerHTML=''; delete l.dataset.built; render(); toast('Todo vuelve a empezar');
    }
  }
});
sheetBody.addEventListener('input',e=>{
  if(e.target.classList.contains('nmi')){
    const h=state.habits.find(x=>x.id===e.target.closest('li').dataset.id); if(h){ h.name=e.target.value; save(); }
  }
});
sheetBody.addEventListener('change',e=>{
  const li=e.target.closest('li'), h=li&&state.habits.find(x=>x.id===li.dataset.id);
  if(h && e.target.type==='checkbox'){
    if(!e.target.checked && required().length===1){ e.target.checked=true; warn('Tiene que haber al menos un hábito obligatorio.'); return; }
    h.req=e.target.checked; save();
  }
  if(e.target.id==='figtog'){ state.fig=e.target.checked; save(); renderLadder(); }
});

/* Modo de prueba (escondido: tocar 3 veces el título, o abrir con #prueba) */
function dateLabel(k){ return parse(k).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}); }
function openTest(){
  openSheet(`<div class="grab"></div><h3>Modo de prueba</h3>
    <p class="help">Día de la app: <b>${esc(dateLabel(state.day))}</b></p>
    <button class="primary" data-act="nextday">Simular siguiente día</button>
    <button class="ghost" data-act="fill">Completar la misión de hoy</button>
    <div class="trow"><label class="sw" style="width:100%;justify-content:space-between"><span>Mostrar figura sobre el escalón</span><input type="checkbox" id="figtog" ${state.fig?'checked':''}><i></i></label></div>
    <button class="ghost danger" data-act="reset" style="margin-top:14px">Empezar de cero</button>`);
}
function simulateNextDay(){
  state.offset=(state.offset||0)+1; rollover(); save();
  closeSheet(); render({anim:true});
  toast(`Nuevo día: ${dateLabel(state.day)}`);
}
let toastT=null;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400); }

/* ---------- Eventos ---------- */
$('#btnHist').innerHTML=ico('cal');
$('#btnBack').innerHTML=ico('back');
$('#btnEdit').innerHTML=ico('pencil')+'Editar hábitos';
$('#btnHist').addEventListener('click',()=>{ $('#viewMain').hidden=true; $('#viewHist').hidden=false; window.scrollTo(0,0); });
$('#btnBack').addEventListener('click',()=>{ $('#viewHist').hidden=true; $('#viewMain').hidden=false; window.scrollTo(0,0); });
$('#btnEdit').addEventListener('click',openEdit);
$('#list').addEventListener('click',e=>{ const b=e.target.closest('.habit'); if(b) toggle(b.dataset.id); });
$('#notice').addEventListener('click',e=>{ if(e.target.id==='btnNotice'){ state.notice=null; save(); renderNotice(); } });
$('#reward').addEventListener('click',closeReward);
let taps=[];
$('#title').addEventListener('click',()=>{
  const n=Date.now(); taps=taps.filter(t=>n-t<800); taps.push(n);
  if(taps.length>=3){ taps=[]; openTest(); }
});

/* Cambio de día mientras la app está abierta */
function checkDay(){ if(state.day<todayKey()){ rollover(); save(); render({anim:true}); } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkDay(); });
setInterval(checkDay,30000);

/* ---------- Inicio ---------- */
rollover(); save();
buildList(); render();
if(location.hash==='#prueba') openTest();
})();
</script>
